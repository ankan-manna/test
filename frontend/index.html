<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="registration-form">
        <h2>Register</h2>
        <form id="registerForm">
            <div>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <label for="avatar">Avatar:</label>
                <input type="file" id="avatar" name="avatar" accept="image/*">
            </div>
            <div>
                <label for="coverImage">Cover Image:</label>
                <input type="file" id="coverImage" name="coverImage" accept="image/*">
            </div>
            <button type="submit">Register</button>
        </form>
    </div>

    <div id="login-form">
        <h2>Login</h2>
        <form id="loginForm">
            <div>
                <label for="loginEmailOrUsername">Email/Username:</label>
                <input type="text" id="loginEmailOrUsername" name="loginEmailOrUsername" required>
            </div>
            <div>
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="loginPassword" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <div id="user-details" style="display: none;">
        <h2>User Details</h2>
        <p>Full Name: <span id="userFullName"></span></p>
        <p>Username: <span id="userUsername"></span></p>
        <p>Email: <span id="userEmail"></span></p>
        <img id="userAvatar" src="" alt="Avatar" style="width: 100px; height: 100px;">
        <div><button id="updateAccountBtn">Update account</button></div>
        <div><button id="changePasswordBtn">Change password</button></div>
        <button id="logoutBtn">Logout</button>

        
        
    </div>
    <script src="app.js"></script>
</body>
</html>
